# Publishes the product website (web/public/site, also served at /site/ on the app's address) to GitHub Pages whenever it changes.
name: Product website

on:
  push:
    branches: [main]
    paths: ['web/public/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public/site
      - id: deployment
        uses: actions/deploy-pages@v4
